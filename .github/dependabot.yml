version: 2
updates:
  # pnpm projects are monitored under the "npm" ecosystem. This project pins exact
  # versions, so each proposed update is an explicit, reviewable bump.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
