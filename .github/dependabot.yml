version: 2
updates:
  # Version-update pull requests are disabled (limit 0): the owner wants no open
  # pull requests. Dependency bumps are made on request through a `fix/*` branch.
  # A limit of 0 does not affect Dependabot security updates.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
