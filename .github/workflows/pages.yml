name: Validate and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # PR validation executes on GitHub's synthetic merge ref so tool tests
          # see the latest base integration, but path selection below compares
          # only the PR's own base/head SHAs to avoid unrelated main changes.
          fetch-depth: 0
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:unit
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            pnpm test:e2e
            exit 0
          fi

          git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > /tmp/inmotools-changed-paths.txt
          E2E_SPECS="$(node scripts/select-e2e-specs.mjs /tmp/inmotools-changed-paths.txt)"
          if [[ -z "$E2E_SPECS" || "$E2E_SPECS" == "__FULL_SUITE__" ]]; then
            echo "Cross-cutting or unmapped change detected; running the full browser suite."
            pnpm test:e2e
          else
            echo "Running focused browser specs:"
            printf '%s\n' "$E2E_SPECS"
            # Spec paths are repository-controlled and contain no whitespace.
            # shellcheck disable=SC2086
            pnpm exec playwright test $E2E_SPECS
          fi
      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  build-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production Pages artifact
        run: pnpm build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build-pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Every main commit gets its own deployment. Serialize production writes, but
    # retain the pending queue instead of replacing older commits with newer ones.
    concurrency:
      group: pages
      queue: max
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
