name: Validate and deploy Pages

on:
  # Record-only changes run .github/workflows/docs.yml instead of the full suite.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**/*.md'
      - '.tasks/**/*.md'
      - '*.md'
      - 'src/tools/**/README.md'
      - 'src/tools/**/TRACKER.md'
      - 'src/tools/**/*_TRACKER.md'
      - 'src/tools/**/VERIFICATION.md'
      - 'src/tools/**/HANDOFF.md'
      - 'src/tools/**/STATUS.md'
      - 'src/tools/**/WORK_LOG.md'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/docs-sync.mjs'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**/*.md'
      - '.tasks/**/*.md'
      - '*.md'
      - 'src/tools/**/README.md'
      - 'src/tools/**/TRACKER.md'
      - 'src/tools/**/*_TRACKER.md'
      - 'src/tools/**/VERIFICATION.md'
      - 'src/tools/**/HANDOFF.md'
      - 'src/tools/**/STATUS.md'
      - 'src/tools/**/WORK_LOG.md'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/docs-sync.mjs'
  # integrate.yml dispatches this after it has validated and pushed a merge to main
  # (its push cannot trigger workflows), with validate=false to deploy only.
  workflow_dispatch:
    inputs:
      validate:
        description: Run required validation as well as deploying
        type: boolean
        default: true
      scope:
        description: Affected scope or explicit full stable-batch checkpoint
        type: choice
        options: [affected, full]
        default: affected
      base_ref:
        description: Base commit for affected manual validation (missing or invalid uses full)
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # PR validation executes on GitHub's synthetic merge ref so tool tests
          # see the latest base integration, but path selection below compares
          # only the PR's own base/head SHAs to avoid unrelated main changes.
          fetch-depth: 0
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Records in step with the catalog
        run: pnpm docs:check
      - name: Unit tests
        run: pnpm test:unit
      - name: Build
        run: pnpm build
      - name: Browser tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ inputs.base_ref }}
          BROWSER_SCOPE: ${{ inputs.scope || 'affected' }}
        run: node scripts/run-browser-validation.mjs
      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  build-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production Pages artifact
        run: pnpm build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build-pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Every main commit gets its own deployment. Serialize production writes, but
    # retain the pending queue instead of replacing older commits with newer ones.
    concurrency:
      group: pages
      queue: max
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
