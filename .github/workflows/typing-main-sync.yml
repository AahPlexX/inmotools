name: Typing current-main one-shot sync

on:
  push:
    branches:
      - feature/typing-workstation
    paths:
      - .github/workflows/typing-main-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/typing-workstation
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Merge current main and preserve both workstreams
        env:
          EXPECTED_MAIN: 55887b71eb6ab29886ec72faad43ea4d02e02e0b
        run: |
          set -euo pipefail
          git config user.name "AahPlexX"
          git config user.email "130876266+AahPlexX@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

          MERGE_BASE="$(git merge-base HEAD origin/main)"
          cp package.json /tmp/typing-package.json
          git show "$MERGE_BASE:package.json" > /tmp/base-package.json

          python <<'PY'
          from pathlib import Path
          import json, re

          tracker = Path('.tasks/IN_PROGRESS.md').read_text()
          match = re.search(r'(?ms)^- \*\*Typing Workstation\*\*.*?(?=^\- \*\*|\Z)', tracker)
          if not match:
              raise SystemExit('Typing tracker block not found')
          Path('/tmp/typing-tracker-block.txt').write_text(match.group(0).rstrip() + '\n\n')

          catalog_lines = Path('src/catalog.ts').read_text().splitlines()
          slug_lines = [line for line in catalog_lines if "| 'typing-workstation'" in line]
          tool_lines = [line for line in catalog_lines if "slug:'typing-workstation'" in line]
          if len(slug_lines) != 1 or len(tool_lines) != 1:
              raise SystemExit(f'Unexpected Typing catalog fragments: slug={len(slug_lines)} tool={len(tool_lines)}')
          Path('/tmp/typing-catalog-slug.txt').write_text(slug_lines[0] + '\n')
          Path('/tmp/typing-catalog-tool.txt').write_text(tool_lines[0] + '\n')

          workspace_lines = Path('src/tools/workspaces.tsx').read_text().splitlines()
          loader_lines = [line for line in workspace_lines if "'typing-workstation':" in line]
          if len(loader_lines) != 1:
              raise SystemExit(f'Unexpected Typing loader fragments: {len(loader_lines)}')
          Path('/tmp/typing-workspace-loader.txt').write_text(loader_lines[0] + '\n')
          PY

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
          expected=(.tasks/IN_PROGRESS.md package.json pnpm-lock.yaml src/catalog.ts src/tools/workspaces.tsx)
          for path in "${unresolved[@]}"; do
            allowed=false
            for candidate in "${expected[@]}"; do
              if [[ "$path" == "$candidate" ]]; then allowed=true; break; fi
            done
            if [[ "$allowed" != true ]]; then
              echo "Unexpected merge conflict: $path" >&2
              exit 1
            fi
          done
          if [[ $merge_status -ne 0 && ${#unresolved[@]} -eq 0 ]]; then
            echo "Merge failed without resolvable conflicts" >&2
            exit 1
          fi

          # Shared integration files start from current main, then receive the
          # Typing-only additions captured above.
          git checkout --theirs -- .tasks/IN_PROGRESS.md package.json pnpm-lock.yaml src/catalog.ts src/tools/workspaces.tsx

          python <<'PY'
          from pathlib import Path
          import copy, json

          base = json.loads(Path('/tmp/base-package.json').read_text())
          ours = json.loads(Path('/tmp/typing-package.json').read_text())
          target_path = Path('package.json')
          target = json.loads(target_path.read_text())

          for section in ('dependencies', 'devDependencies'):
              base_section = base.get(section, {})
              ours_section = ours.get(section, {})
              target.setdefault(section, {})
              other = 'devDependencies' if section == 'dependencies' else 'dependencies'
              for name, version in ours_section.items():
                  if name not in base_section or base_section.get(name) != version:
                      target[section][name] = version
                      if target.get(other, {}).get(name) == version:
                          del target[other][name]
              target[section] = dict(sorted(target[section].items()))
          target_path.write_text(json.dumps(target, indent=2) + '\n')

          tracker_path = Path('.tasks/IN_PROGRESS.md')
          tracker = tracker_path.read_text()
          typing_block = Path('/tmp/typing-tracker-block.txt').read_text()
          if '**Typing Workstation**' not in tracker:
              marker = '# In Progress\n\n'
              if marker not in tracker:
                  raise SystemExit('Tracker heading marker not found')
              tracker = tracker.replace(marker, marker + typing_block, 1)
          tracker_path.write_text(tracker)

          catalog_path = Path('src/catalog.ts')
          catalog = catalog_path.read_text()
          slug_line = Path('/tmp/typing-catalog-slug.txt').read_text().rstrip()
          tool_line = Path('/tmp/typing-catalog-tool.txt').read_text().rstrip()
          if "| 'typing-workstation'" not in catalog:
              lines = catalog.splitlines()
              start = next(i for i, line in enumerate(lines) if line.startswith('export type ToolSlug'))
              end = next(i for i in range(start + 1, len(lines)) if lines[i].rstrip().endswith(';'))
              lines[end] = lines[end].rstrip()[:-1]
              lines.insert(end + 1, slug_line)
              catalog = '\n'.join(lines) + '\n'
          if "slug:'typing-workstation'" not in catalog:
              lines = catalog.splitlines()
              start = next(i for i, line in enumerate(lines) if line.startswith('export const TOOLS:'))
              end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == '];')
              lines.insert(end, tool_line)
              catalog = '\n'.join(lines) + '\n'
          catalog_path.write_text(catalog)

          workspace_path = Path('src/tools/workspaces.tsx')
          workspace = workspace_path.read_text()
          loader_line = Path('/tmp/typing-workspace-loader.txt').read_text().rstrip()
          if "'typing-workstation':" not in workspace:
              lines = workspace.splitlines()
              start = next(i for i, line in enumerate(lines) if line.startswith('const workspaceLoaders:'))
              end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == '};')
              lines.insert(end, loader_line)
              workspace = '\n'.join(lines) + '\n'
          workspace_path.write_text(workspace)
          PY

          pnpm install --lockfile-only

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts remain' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git add .
          git commit -m "merge: sync current main into typing workstation"
          git push origin HEAD:feature/typing-workstation
