name: Typing PB one-shot maintenance

on:
  push:
    branches:
      - feature/typing-workstation
    paths:
      - .github/workflows/typing-pb-maintenance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/typing-workstation
          fetch-depth: 0
      - name: Patch personal-best workspace wiring
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/tools/typing/TypingWorkspace.tsx')
          text = path.read_text()

          old_lookup = '      const pb = await findPersonalBest(config.mode, dur.value);'
          new_lookup = """      const pb = await findPersonalBest({
                mode: config.mode,
                durationMode: dur.mode,
                durationValue: dur.value,
                language: config.language,
                layout: config.layout,
                quoteLength: config.durationMode === 'quote' ? config.quoteLength : undefined,
              });"""
          if text.count(old_lookup) != 1:
              raise SystemExit(f'PB lookup guard expected 1 match, found {text.count(old_lookup)}')
          text = text.replace(old_lookup, new_lookup, 1)

          old_deps = '  }, [config.mode, config.durationMode, config.durationValue]);'
          new_deps = '  }, [config.mode, config.durationMode, config.durationValue, config.language, config.layout, config.quoteLength]);'
          if text.count(old_deps) != 1:
              raise SystemExit(f'PB dependency guard expected 1 match, found {text.count(old_deps)}')
          text = text.replace(old_deps, new_deps, 1)

          old_saved_pb = '    setPersonalBest(await findPersonalBest(config.mode, dur.value) ?? null);'
          new_saved_pb = """    setPersonalBest(await findPersonalBest({
                mode: config.mode,
                durationMode: dur.mode,
                durationValue: dur.value,
                language: config.language,
                layout: config.layout,
                quoteLength: config.durationMode === 'quote' ? config.quoteLength : undefined,
              }) ?? null);"""
          if text.count(old_saved_pb) != 1:
              raise SystemExit(f'post-save PB guard expected 1 match, found {text.count(old_saved_pb)}')
          text = text.replace(old_saved_pb, new_saved_pb, 1)

          save_marker = '      durationValue: dur.value,\n      language: config.language,'
          save_replacement = "      durationValue: dur.value,\n      quoteLength: config.durationMode === 'quote' ? config.quoteLength : undefined,\n      language: config.language,"
          if text.count(save_marker) != 1:
              raise SystemExit(f'save record guard expected 1 match, found {text.count(save_marker)}')
          text = text.replace(save_marker, save_replacement, 1)

          fallback_marker = '          durationValue: dur.value,\n          language: config.language,'
          fallback_replacement = "          durationValue: dur.value,\n          quoteLength: config.durationMode === 'quote' ? config.quoteLength : undefined,\n          language: config.language,"
          if text.count(fallback_marker) != 2:
              raise SystemExit(f'export fallback guard expected 2 matches, found {text.count(fallback_marker)}')
          text = text.replace(fallback_marker, fallback_replacement)

          path.write_text(text)
          PY
      - name: Commit source correction
        run: |
          git config user.name "AahPlexX"
          git config user.email "130876266+AahPlexX@users.noreply.github.com"
          git add src/tools/typing/TypingWorkspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(typing): scope personal best ghosts [skip ci]"
          git push origin HEAD:feature/typing-workstation
