name: CAD temporary branch validation

on:
  push:
    branches:
      - feat/cad-studio

permissions:
  contents: read

jobs:
  validate-cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Focused datum-plane tests
        run: pnpm exec vitest run tests/unit/cad-sketch-profile.test.ts tests/unit/cad-profile-features.test.ts
      - name: Complete CAD unit suite
        run: pnpm exec vitest run tests/unit/cad-*.test.ts
      - name: Production build
        run: pnpm build
