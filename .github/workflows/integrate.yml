name: Integrate branch into main

# Every push to feature/<slug>, expand/<slug> or fix/<slug> is merged into main here,
# without a pull request: merge onto the latest main, check, push main, delete the
# branch. If main moves during the run, the push is rejected and the run retries on
# the new main. Nothing is merged unless every check passes on the merged result.
# A conflict only in the generated .tasks/ITEMS.md is resolved by regenerating it.
# On a retry, if main gained only Markdown changes since the tested merge, the
# build and browser tests are not repeated (unit tests and doc checks still run).
# A push whose only change is the claim made by `pnpm task:start` is not merged, so
# the branch stays on origin as the claim until it carries work.
on:
  push:
    branches: ['feature/**', 'expand/**', 'fix/**']

permissions:
  contents: write # push main, delete the branch
  actions: write # start the Pages deployment (pushes made with GITHUB_TOKEN trigger no workflows)

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true # a newer push to the same branch supersedes this run

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Merge, check and push to main
        env:
          BRANCH: ${{ github.ref_name }}
          BRANCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          kind="${BRANCH%%/*}"
          slug="${BRANCH#*/}"

          pushed=false
          tested_base=""
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git checkout --quiet -B integrate origin/main
            if ! git merge --quiet --no-ff --no-edit -m "integrate $BRANCH" "$BRANCH_SHA"; then
              unmerged="$(git diff --name-only --diff-filter=U)"
              if [[ "$unmerged" == ".tasks/ITEMS.md" ]]; then
                # Generated file: rebuild it from the merged task files.
                git checkout --quiet --ours .tasks/ITEMS.md
                node scripts/docs-sync.mjs > /dev/null
                git add .tasks/ITEMS.md
                git commit --quiet --no-edit
                echo "Regenerated .tasks/ITEMS.md to resolve its merge conflict."
              else
                echo "::error::$BRANCH conflicts with main in: $(tr '\n' ' ' <<< "$unmerged"). On the branch: git fetch origin && git merge origin/main, resolve, commit, push."
                exit 1
              fi
            fi
            light=false
            if [[ -n "$tested_base" ]] && BEFORE_SHA="$tested_base" HEAD_SHA="$(git rev-parse origin/main)" node --input-type=module -e 'import { validationPlan, canReuseBrowserValidation } from "./scripts/run-browser-validation.mjs"; process.exit(canReuseBrowserValidation(validationPlan({eventName: "push", beforeSha: process.env.BEFORE_SHA, headSha: process.env.HEAD_SHA})) ? 0 : 1)'; then
              light=true
              echo "main gained only records without browser impact since the tested merge; reusing build and browser checks on this attempt."
            fi
            changed="$(git diff --name-only origin/main HEAD)"
            if [[ -z "$changed" ]]; then
              echo "Nothing to integrate: main already contains $BRANCH."
              pushed=true
              break
            fi
            if ! grep -qv '^\.tasks/items/' <<< "$changed" && git log -1 --format=%s "$BRANCH_SHA" | grep -q '^chore(tasks): start '; then
              echo "Only the task claim is on $BRANCH; kept as the claim until it carries work." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if grep -q '^\.github/workflows/' <<< "$changed"; then
              echo "::error::$BRANCH changes .github/workflows/, which a workflow token cannot push. Run the checks locally and push the merge to main yourself."
              exit 1
            fi

            pnpm install --frozen-lockfile
            node scripts/branch-check.mjs "$BRANCH"
            strict=""; [[ "$kind" == feature ]] && strict="--strict"
            node scripts/tool-check.mjs "$slug" $strict --base origin/main
            pnpm docs:sync
            if ! git diff --quiet -- docs/TOOL_INDEX.md .tasks/ITEMS.md; then
              git add docs/TOOL_INDEX.md .tasks/ITEMS.md
              git commit --quiet -m "chore(docs): sync tool index and task view for $BRANCH"
            fi
            node scripts/check-doc-links.mjs
            pnpm test:unit

            if [[ "$light" == false ]]; then
              EVENT_NAME=push BEFORE_SHA="$(git rev-parse origin/main)" HEAD_SHA="$(git rev-parse HEAD)" \
                node scripts/run-browser-validation.mjs --build
            fi

            tested_base="$(git rev-parse origin/main)"
            if git push --quiet origin HEAD:main; then
              pushed=true
              break
            fi
            echo "main moved during attempt $attempt; retrying on the new main."
          done
          [[ "$pushed" == true ]] || { echo "::error::main kept moving; push $BRANCH again to retry."; exit 1; }

          gh workflow run pages.yml --ref main -f validate=false
          # Delete only if the branch still points at what was integrated.
          git push --quiet --force-with-lease="refs/heads/$BRANCH:$BRANCH_SHA" origin ":refs/heads/$BRANCH" \
            || echo "::notice::$BRANCH moved after this run started; kept for the next run."
          echo "Integrated $BRANCH into main: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: integrate-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
