name: Typing Workstation validation

# Pages owns automatic main/PR validation; custom coverage remains callable.
on:
  workflow_dispatch:

concurrency:
  group: typing-workstation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Focused typing unit tests
        run: pnpm exec vitest run tests/unit/typing-*.test.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Typing browser tests
        run: pnpm exec playwright test tests/e2e/typing.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: typing-workstation-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7