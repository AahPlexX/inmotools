name: CAD solver numerical migration

on:
  push:
    branches:
      - feat/cad-studio
    paths:
      - .github/workflows/cad-solver-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CAD branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Migrate sketch solver to ml-matrix layer
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/tools/cad/sketch-solver.ts';
          let source = fs.readFileSync(path, 'utf8');

          const importNeedle = "import { buildInterpolatingSpline, evaluateSpline, evaluateSplineDerivative } from './sketch-spline';\n";
          if (!source.includes(importNeedle)) throw new Error('Expected spline import was not found.');
          if (source.includes("from './sketch-linear-algebra'")) throw new Error('Numerical-layer import already exists.');
          source = source.replace(
            importNeedle,
            importNeedle + "import { numericalRank, solveDampedNormalEquations } from './sketch-linear-algebra';\n",
          );

          const helperPattern = /function normalEquations\([\s\S]*?\nfunction solveCore\(/;
          const helperMatch = source.match(helperPattern);
          if (!helperMatch) throw new Error('Custom numerical helper block was not found.');
          const helperNames = [...helperMatch[0].matchAll(/function\s+([A-Za-z0-9_]+)/g)].map((match) => match[1]);
          const expectedHelpers = ['normalEquations', 'solveLinearSystem', 'matrixRank', 'solveCore'];
          if (JSON.stringify(helperNames) !== JSON.stringify(expectedHelpers)) {
            throw new Error(`Unexpected functions in numerical helper block: ${helperNames.join(', ')}`);
          }
          source = source.replace(helperPattern, 'function solveCore(');

          const solveNeedle = `      const { matrix, rhs } = normalEquations(jacobian, residuals, damping);\n      const delta = solveLinearSystem(matrix, rhs);`;
          if (!source.includes(solveNeedle)) throw new Error('Expected Gauss-Newton solve call site was not found.');
          source = source.replace(
            solveNeedle,
            `      const delta = solveDampedNormalEquations(jacobian, residuals, damping);`,
          );

          const rankNeedle = 'core.values.length - matrixRank(hardJacobian)';
          if (!source.includes(rankNeedle)) throw new Error('Expected rank call site was not found.');
          source = source.replace(rankNeedle, 'core.values.length - numericalRank(hardJacobian)');

          for (const forbidden of ['function normalEquations(', 'function solveLinearSystem(', 'function matrixRank(']) {
            if (source.includes(forbidden)) throw new Error(`Legacy numerical helper remains: ${forbidden}`);
          }
          fs.writeFileSync(path, source);
          NODE

          git diff --check
          git diff -- src/tools/cad/sketch-solver.ts

      - name: Commit migrated solver
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/cad/sketch-solver.ts
          git commit -m "refactor(cad): use ml-matrix in sketch solver"
          git push origin HEAD:feat/cad-studio
