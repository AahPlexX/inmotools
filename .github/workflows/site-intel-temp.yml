name: Temporary Site Intelligence completion validation

on:
  push:
    branches:
      - feature/site-analysis-workstation

permissions:
  contents: read

jobs:
  site-intel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Site Intelligence unit tests
        run: pnpm exec vitest run tests/unit/site-intel*.test.ts
      - name: Production build
        run: pnpm prepare:pyodide && pnpm prepare:libarchive && pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Site Intelligence browser tests
        run: pnpm exec playwright test tests/e2e/site-intel.spec.ts
