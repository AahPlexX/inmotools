name: Typing Workstation guarded maintenance

on:
  push:
    branches: [feature/typing-workstation]
    paths:
      - '.github/workflows/typing-maintenance.yml'

concurrency:
  group: typing-maintenance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: github.ref_name == 'feature/typing-workstation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/typing-workstation
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Bundle the selectable local fonts with exact pins
        run: >-
          pnpm add --save-exact
          @fontsource/jetbrains-mono@5.3.0
          @fontsource/fira-code@5.3.0
          @fontsource/roboto-mono@5.3.0
          @fontsource/atkinson-hyperlegible@5.3.0
          @fontsource/opendyslexic@5.3.0
      - name: Restore matching targets, announce exports, and correct extra-key indexing
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace_path = Path('src/tools/typing/TypingWorkspace.tsx')
          text = workspace_path.read_text()

          def once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one target, found {count}')
              text = text.replace(old, new, 1)

          once(
              "import { useCallback, useEffect, useMemo, useReducer, useRef, useState, type ReactNode } from 'react';\nimport Chart from 'chart.js/auto';",
              "import { useCallback, useEffect, useMemo, useReducer, useRef, useState, type ReactNode } from 'react';\nimport '@fontsource/jetbrains-mono/400.css';\nimport '@fontsource/fira-code/400.css';\nimport '@fontsource/roboto-mono/400.css';\nimport '@fontsource/atkinson-hyperlegible/400.css';\nimport '@fontsource/opendyslexic/400.css';\nimport Chart from 'chart.js/auto';",
              'font imports',
          )

          once(
              "        const saved = await readPreference<Partial<Config> | null>('config', null);\n        if (saved) setConfig((c) => ({ ...c, ...saved }));\n        const rows = await listTests();",
              "        const saved = await readPreference<Partial<Config> | null>('config', null);\n        if (saved) {\n          const restored = { ...DEFAULT_CONFIG, ...saved };\n          const restoredTarget = buildTargetText(restored, seed);\n          setConfig(restored);\n          setTarget(restoredTarget);\n          dispatch({ type: 'reset', initial: initState(restoredTarget, {\n            errorMode: restored.errorMode,\n            allowExtraChars: restored.allowExtras,\n            caseSensitive: restored.caseSensitive,\n          }) });\n        }\n        const rows = await listTests();",
              'persisted config target restoration',
          )

          once(
              "    if (format === 'keystrokes') downloadText(keystrokesToCsv(currentTest.keystrokes ?? []), suggestFilename('csv', 'test').replace('.csv', '-keystrokes.csv'), 'text/csv;charset=utf-8');\n  }, [config, engine, history, metrics, savedTestId, target, handleSave]);",
              "    if (format === 'keystrokes') downloadText(keystrokesToCsv(currentTest.keystrokes ?? []), suggestFilename('csv', 'test').replace('.csv', '-keystrokes.csv'), 'text/csv;charset=utf-8');\n    setStatusText(`Exported ${format === 'keystrokes' ? 'keystroke CSV' : format.toUpperCase()} for this test.`);\n  }, [config, engine, history, metrics, savedTestId, target, handleSave]);",
              'single export announcement',
          )

          once(
              "    if (format === 'md') downloadText(sessionMarkdown(filtered, meta), stamp, 'text/markdown;charset=utf-8');\n  }, [filterTagText]);",
              "    if (format === 'md') downloadText(sessionMarkdown(filtered, meta), stamp, 'text/markdown;charset=utf-8');\n    setStatusText(`Exported ${format === 'md' ? 'Markdown' : format.toUpperCase()} history.`);\n  }, [filterTagText]);",
              'history export announcement',
          )

          workspace_path.write_text(text)

          engine_path = Path('src/tools/typing/typing-engine.ts')
          engine = engine_path.read_text()
          old = "    if (opts.allowExtraChars) {\n      cells.push({ expected: '', typed: key, state: 'extra', t });\n      extraKeystrokes += 1;\n      cursor += 1;\n    }\n    events.push({ t, key, code, correct: false, index: cursor, expected: '' });"
          new = "    const extraIndex = cursor;\n    if (opts.allowExtraChars) {\n      cells.push({ expected: '', typed: key, state: 'extra', t });\n      extraKeystrokes += 1;\n      cursor += 1;\n    }\n    events.push({ t, key, code, correct: false, index: extraIndex, expected: '' });"
          if engine.count(old) != 1:
              raise SystemExit(f'extra-key event indexing: expected exactly one target, found {engine.count(old)}')
          engine_path.write_text(engine.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit guarded corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml src/tools/typing/TypingWorkspace.tsx src/tools/typing/typing-engine.ts
          git commit -m "fix(typing): bundle selectable fonts and restore persisted targets"
          git push origin HEAD:feature/typing-workstation
