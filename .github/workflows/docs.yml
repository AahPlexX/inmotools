name: Documentation checks

# Runs instead of the full browser suite when a push or PR changes only Markdown
# (pages.yml and focused-tool.yml ignore Markdown-only changes). It runs the unit
# tests that read Markdown files and checks links in the standard documents.
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/docs-sync.mjs'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/check-doc-links.mjs'
      - 'scripts/docs-sync.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Records in step with the catalog, links resolve
        run: pnpm docs:check
      - name: Unit tests that read Markdown
        run: pnpm exec vitest run tests/unit/cad-progress.test.ts tests/unit/sheets-wave-b.test.ts tests/unit/deployment-config.test.ts
