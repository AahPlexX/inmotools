name: Typing Workstation one-shot maintenance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref_name == 'feature/typing-workstation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/typing-workstation
      - name: Add accessible custom-text dialog semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/tools/typing/TypingWorkspace.tsx')
          text = path.read_text()
          old = '''function CustomTextModal({ value, onCancel, onApply }: { value: string; onCancel: () => void; onApply: (text: string) => void }) {
            const [text, setText] = useState(value);
            return (
              <div className="tw-modal-backdrop" role="dialog" aria-modal="true">
                <div className="tw-modal">
                  <h3>Paste or edit custom text</h3>
                  <p style={{ marginTop: 0, fontSize: '0.85rem' }}>Everything is kept locally. Longer prose becomes book-length practice.</p>
                  <textarea value={text} onChange={(e) => setText(e.target.value)} style={{ minHeight: 240 }} />
                  <div className="row">
                    <button type="button" className="subtle" onClick={onCancel}>Cancel</button>
                    <button type="button" onClick={() => onApply(text)}>Use this text</button>
                  </div>
                </div>
              </div>
            );
          }'''
          new = '''function CustomTextModal({ value, onCancel, onApply }: { value: string; onCancel: () => void; onApply: (text: string) => void }) {
            const [text, setText] = useState(value);
            return (
              <div className="tw-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="tw-custom-text-title">
                <div className="tw-modal">
                  <h3 id="tw-custom-text-title">Paste or edit custom text</h3>
                  <p style={{ marginTop: 0, fontSize: '0.85rem' }}>Everything is kept locally. Longer prose becomes book-length practice.</p>
                  <label htmlFor="tw-custom-text-input">Custom text</label>
                  <textarea id="tw-custom-text-input" autoFocus value={text} onChange={(e) => setText(e.target.value)} style={{ minHeight: 240 }} />
                  <div className="row">
                    <button type="button" className="subtle" onClick={onCancel}>Cancel</button>
                    <button type="button" onClick={() => onApply(text)}>Use this text</button>
                  </div>
                </div>
              </div>
            );
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one custom modal block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Commit branch-only patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/typing/TypingWorkspace.tsx
          git commit -m "fix(typing): label custom text dialog"
          git push origin HEAD:feature/typing-workstation
