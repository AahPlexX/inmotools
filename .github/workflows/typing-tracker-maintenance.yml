name: Typing tracker one-shot maintenance

on:
  push:
    branches: [feature/typing-workstation]
    paths:
      - '.github/workflows/typing-tracker-maintenance.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref_name == 'feature/typing-workstation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/typing-workstation
          fetch-depth: 0
      - name: Refresh Typing acceptance evidence only
        shell: python
        run: |
          from pathlib import Path
          path = Path('.tasks/IN_PROGRESS.md')
          text = path.read_text()
          old = "  - Current milestone: Milestones A-C are complete on `feature/typing-workstation`. Source acceptance revision `11d99cf1a9060a8cbd89a48867507e404fb828ff` passed dedicated workflow run `35020326518`: frozen install, 34 focused unit tests, production build, and 6/6 desktop/mobile Chromium checks covering non-timed completion, JSON export metadata/envelope, IndexedDB reload persistence, serious/critical automated accessibility scanning, and 320 CSS-pixel reflow. Milestone D (exact-main integration + Pages deployment) remains pending and must not be claimed from the dedicated feature branch."
          new = "  - Current milestone: Milestones A-C are complete on `feature/typing-workstation`. Accepted branch revision `bbf895d074a7d9119e4ea687566325658db905e5` passed dedicated workflow run `35117376116` / job `104866123548`: frozen install and supply-chain policy verification, 46/46 focused unit tests, production build, and 8/8 desktop/mobile Chromium checks covering duration-family normalization, exact word counts, real Enter/newline multiline completion, JSON export metadata/envelope and newline preservation, IndexedDB reload persistence, bundled OpenDyslexic loading, modal keyboard semantics, serious/critical automated accessibility scanning, and 320 CSS-pixel reflow. Milestone D (exact-main integration + Pages deployment) remains pending and must not be claimed from the dedicated feature branch."
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Typing milestone match; found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Commit tracker refresh
        run: |
          git config user.name "AahPlexX"
          git config user.email "130876266+AahPlexX@users.noreply.github.com"
          git add .tasks/IN_PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(tasks): refresh typing acceptance evidence [skip ci]"
          git push origin HEAD:feature/typing-workstation
