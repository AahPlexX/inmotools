name: Typing Workstation one-shot fix

on:
  workflow_dispatch:
  push:
    branches: [feature/typing-workstation]
    paths:
      - '.github/workflows/typing-fix-maintenance.yml'

concurrency:
  group: typing-fix-maintenance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: github.ref_name == 'feature/typing-workstation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/typing-workstation
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - name: Apply guarded Typing fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          engine = 'src/tools/typing/typing-engine.ts'
          replace_once(
              engine,
              """  if (key === 'Enter') {\n    // Enter finishes a quote-mode test if we are at the end.\n    if (state.cursor >= state.cells.length && !state.finished) {\n      return finish(state, 'completed', t);\n    }\n    return state;\n  }\n\n  // Ignore modifier / non-character keys.\n  if (key.length !== 1) return state;\n""",
              """  const expectedBeforeInput = state.cells[state.cursor]?.expected;\n  const committedKey = key === 'Enter' && expectedBeforeInput === '\\n' ? '\\n' : key;\n\n  if (key === 'Enter' && committedKey !== '\\n') {\n    // Enter finishes a finite target if the cursor is already at its end.\n    if (state.cursor >= state.cells.length && !state.finished) {\n      return finish(state, 'completed', t);\n    }\n    return state;\n  }\n\n  // Ignore modifier / non-character keys.\n  if (committedKey.length !== 1) return state;\n""",
          )
          replace_once(engine, "cells.push({ expected: '', typed: key, state: 'extra', t });", "cells.push({ expected: '', typed: committedKey, state: 'extra', t });")
          replace_once(engine, "const match = normalize(key, opts.caseSensitive) === normalize(expected, opts.caseSensitive);", "const match = normalize(committedKey, opts.caseSensitive) === normalize(expected, opts.caseSensitive);")
          text = Path(engine).read_text()
          typed_count = text.count("typed: key")
          if typed_count != 4:
              raise SystemExit(f'{engine}: expected four remaining typed:key matches, found {typed_count}')
          Path(engine).write_text(text.replace("typed: key", "typed: committedKey"))

          workspace = 'src/tools/typing/TypingWorkspace.tsx'
          replace_once(
              workspace,
              "import { buildTargetText, buildZenChunk, type DurationMode } from './typing-target';",
              "import { buildTargetText, buildZenChunk, normalizeDurationValue, type DurationMode } from './typing-target';",
          )
          replace_once(
              workspace,
              """          const restored = { ...DEFAULT_CONFIG, ...saved };\n          const restoredTarget = buildTargetText(restored, seed);\n""",
              """          const restoredBase = { ...DEFAULT_CONFIG, ...saved };\n          const restored = {\n            ...restoredBase,\n            durationValue: normalizeDurationValue(restoredBase.durationMode, restoredBase.durationValue),\n          };\n          const restoredTarget = buildTargetText(restored, seed);\n""",
          )
          replace_once(
              workspace,
              """  const applyConfig = useCallback((patch: Partial<Config>) => {\n    const normalized: Partial<Config> = { ...patch };\n    if (patch.durationMode === 'quote') normalized.mode = 'quote';\n""",
              """  const applyConfig = useCallback((patch: Partial<Config>) => {\n    const normalized: Partial<Config> = { ...patch };\n    if (patch.durationMode !== undefined) {\n      normalized.durationValue = normalizeDurationValue(patch.durationMode, patch.durationValue ?? config.durationValue);\n    }\n    if (patch.durationMode === 'quote') normalized.mode = 'quote';\n""",
          )
          replace_once(
              workspace,
              """      normalized.durationMode = 'time';\n    }\n""",
              """      normalized.durationMode = 'time';\n      normalized.durationValue = normalizeDurationValue('time', patch.durationValue ?? config.durationValue);\n    }\n""",
          )
          replace_once(
              workspace,
              """    if (!running && e.key.length === 1) {\n      setRunning(true);\n      setStatusText('Test started.');\n    }\n""",
              """    const commitsExpectedCharacter = e.key.length === 1 || (e.key === 'Enter' && engine.targetText[engine.cursor] === '\\n');\n    if (!running && commitsExpectedCharacter) {\n      setRunning(true);\n      setStatusText('Test started.');\n    }\n""",
          )
          replace_once(
              workspace,
              "}, [engine.finished, rebuildTarget, running, config.audioProfile]);",
              "}, [engine.finished, engine.targetText, engine.cursor, rebuildTarget, running, config.audioProfile]);",
          )
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused Typing unit tests
        run: pnpm exec vitest run tests/unit/typing-*.test.ts
      - name: Commit guarded fixes
        run: |
          git config user.name "AahPlexX"
          git config user.email "130876266+AahPlexX@users.noreply.github.com"
          git add src/tools/typing/typing-engine.ts src/tools/typing/TypingWorkspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(typing): normalize duration and multiline input [skip ci]"
          git push origin HEAD:feature/typing-workstation
