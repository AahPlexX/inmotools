name: Vector path motion fix

on:
  push:
    branches:
      - fix/vector-path-motion-20260916

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/vector-path-motion-20260916

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply path translation fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/tools/svg/vector-engine.ts')
          source = path.read_text()

          import_old = "import { DEFAULT_FILL, DEFAULT_STROKE } from './vector-types';\n"
          import_new = "import { SVGPathData } from 'svg-pathdata';\nimport { DEFAULT_FILL, DEFAULT_STROKE } from './vector-types';\n"
          if import_old not in source:
              raise SystemExit('Expected vector-types import anchor not found')
          source = source.replace(import_old, import_new, 1)

          move_anchor = "function moveElement(element: VectorElement, dx: number, dy: number): VectorElement {\n"
          helper = (
              "function translatedPathData(pathData: string, dx: number, dy: number): string {\n"
              "  return new SVGPathData(pathData)\n"
              "    .translate(dx, dy)\n"
              "    .encode()\n"
              "    .replace(/([MmLlHhVvCcSsQqTtAaZz])/g, ' $1 ')\n"
              "    .trim()\n"
              "    .replace(/\\s+/g, ' ');\n"
              "}\n\n"
          )
          if move_anchor not in source:
              raise SystemExit('Expected moveElement anchor not found')
          source = source.replace(move_anchor, helper + move_anchor, 1)

          line_block = (
              "  if (element.type === 'line') {\n"
              "    return { ...element, x: element.x + dx, y: element.y + dy, x2: element.x2 + dx, y2: element.y2 + dy };\n"
              "  }\n"
          )
          path_block = line_block + (
              "  if (element.type === 'path') {\n"
              "    try {\n"
              "      return {\n"
              "        ...element,\n"
              "        x: element.x + dx,\n"
              "        y: element.y + dy,\n"
              "        d: translatedPathData(element.d, dx, dy),\n"
              "      };\n"
              "    } catch {\n"
              "      return element;\n"
              "    }\n"
              "  }\n"
          )
          if line_block not in source:
              raise SystemExit('Expected line motion block not found')
          source = source.replace(line_block, path_block, 1)
          path.write_text(source)
          PY

          pnpm add --save-exact svg-pathdata@9.0.0

      - name: Focused Vector tests
        run: pnpm exec vitest run tests/unit/vector-engine-path-motion.test.ts tests/unit/vector-engine.test.ts tests/unit/vector-export.test.ts tests/unit/vector-duplicate-ids.test.ts tests/unit/vector-selection.test.ts

      - name: Production build
        run: pnpm build

      - name: Commit verified fix and remove diagnostic workflow
        shell: bash
        run: |
          rm .github/workflows/vector-path-motion-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml src/tools/svg/vector-engine.ts .github/workflows/vector-path-motion-fix.yml
          git commit -m "fix(vector): translate SVG path geometry during motion"
          git push origin HEAD:fix/vector-path-motion-20260916
