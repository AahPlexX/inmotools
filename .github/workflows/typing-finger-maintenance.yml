name: Typing finger-map one-shot maintenance

on:
  push:
    branches:
      - feature/typing-workstation
    paths:
      - .github/workflows/typing-finger-maintenance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/typing-workstation
          fetch-depth: 0
      - name: Correct positional finger guidance
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/tools/typing/typing-corpora.ts')
          text = path.read_text()

          marker = '\nexport const LAYOUTS: LayoutDefinition[] = ['
          helper = '''

const FINGER_POSITIONS: readonly (readonly string[])[] = [
  ['l5','l5','l4','l3','l2','l2','r2','r2','r3','r4','r5','r5','r5'],
  ['l5','l4','l3','l2','l2','r2','r2','r3','r4','r5','r5','r5','r5'],
  ['l5','l4','l3','l2','l2','r2','r2','r3','r4','r5','r5','r5'],
  ['l5','l4','l3','l2','l2','r2','r2','r3','r4','r5','r5'],
  ['thumb'],
];

function fingersForRows(rows: LayoutRow[]): Record<string, string> {
  const fingers: Record<string, string> = {};
  rows.forEach((row, rowIndex) => {
    row.keys.forEach((key, keyIndex) => {
      const finger = FINGER_POSITIONS[rowIndex]?.[keyIndex];
      if (finger) fingers[key] = finger;
    });
  });
  return fingers;
}

export const LAYOUTS: LayoutDefinition[] = ['''
          if text.count(marker) != 1:
              raise SystemExit(f'layout marker expected 1 match, found {text.count(marker)}')
          text = text.replace(marker, helper, 1)

          old_return = '''export function findLayout(id: LayoutId): LayoutDefinition {
  const found = LAYOUTS.find((l) => l.id === id);
  if (!found) throw new Error(`Unknown layout: ${id}`);
  return found;
}'''
          new_return = '''export function findLayout(id: LayoutId): LayoutDefinition {
  const found = LAYOUTS.find((l) => l.id === id);
  if (!found) throw new Error(`Unknown layout: ${id}`);
  return { ...found, fingers: fingersForRows(found.rows) };
}'''
          if text.count(old_return) != 1:
              raise SystemExit(f'findLayout guard expected 1 match, found {text.count(old_return)}')
          text = text.replace(old_return, new_return, 1)
          path.write_text(text)
          PY
      - name: Commit source correction
        run: |
          git config user.name "AahPlexX"
          git config user.email "130876266+AahPlexX@users.noreply.github.com"
          git add src/tools/typing/typing-corpora.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(typing): map fingers by physical key position [skip ci]"
          git push origin HEAD:feature/typing-workstation
