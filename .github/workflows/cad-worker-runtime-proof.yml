name: CAD worker runtime proof

on:
  push:
    branches:
      - feat/cad-studio
    paths:
      - .github/workflows/cad-worker-runtime-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          runtime: node@24
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Start CAD worker fixture
        shell: bash
        run: |
          pnpm exec vite tests/fixtures/cad-worker-bundle --host 127.0.0.1 --port 4179 > "$RUNNER_TEMP/cad-worker-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cad-worker-vite.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4179/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/cad-worker-vite.log"
          exit 1

      - name: Prove browser capability gate and OCCT initialization
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          await page.goto('http://127.0.0.1:4179/');
          await page.waitForFunction(() => document.documentElement.dataset.cadWorkerProof !== 'pending', null, { timeout: 30000 });
          const result = await page.evaluate(() => ({
            proof: document.documentElement.dataset.cadWorkerProof,
            code: document.documentElement.dataset.cadWorkerCode,
            recoverable: document.documentElement.dataset.cadWorkerRecoverable,
          }));
          console.log('CAD worker browser proof:', JSON.stringify(result));
          await browser.close();
          if (result.proof !== 'response' || result.code !== 'evaluation-failed' || result.recoverable !== 'true') {
            throw new Error(`Expected post-initialization G6 evaluator sentinel, received ${JSON.stringify(result)}`);
          }
          EOF

      - name: Stop fixture
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/cad-worker-vite.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/cad-worker-vite.pid")" 2>/dev/null || true
          fi
          cat "$RUNNER_TEMP/cad-worker-vite.log" 2>/dev/null || true
