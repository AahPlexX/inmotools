name: Mermaid lockfile refresh

on:
  push:
    branches:
      - fix/markdown-mermaid-audit-20260912
    paths:
      - .github/workflows/mermaid-lock-refresh.yml
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Regenerate exact dependency graph
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify exact pins
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.mermaid!=='12.0.0') process.exit(1)"
          node -e "const fs=require('node:fs'); const w=fs.readFileSync('pnpm-workspace.yaml','utf8'); if(!/overrides:\s*[\s\S]*lodash-es:\s*4\.18\.1/.test(w)) process.exit(1)"
          if grep -q 'lodash-es@4.17.23' pnpm-lock.yaml; then
            echo 'Vulnerable lodash-es 4.17.23 is still present in the lockfile.'
            exit 1
          fi

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'No lockfile changes generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(deps): apply pnpm 12 dependency override'
          git push origin HEAD:${{ github.ref_name }}
