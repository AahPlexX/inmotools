name: Mermaid lockfile refresh

on:
  push:
    branches:
      - fix/markdown-mermaid-audit-20260912
    paths:
      - .github/workflows/mermaid-lock-refresh.yml
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Pin patched transitive dependency
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.pnpm = pkg.pnpm || {};
          pkg.pnpm.overrides = { ...(pkg.pnpm.overrides || {}), 'lodash-es': '4.18.1' };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Resolve exact Mermaid dependency graph
        run: |
          pnpm add mermaid@12.0.0 --save-exact --lockfile-only
          pnpm install --lockfile-only

      - name: Verify exact pins
        run: node -e "const p=require('./package.json'); if(p.dependencies.mermaid!=='12.0.0'||p.pnpm?.overrides?.['lodash-es']!=='4.18.1') process.exit(1)"

      - name: Commit generated manifest and lockfile
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo 'No dependency changes generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m 'chore(deps): pin patched Mermaid dependency graph'
          git push origin HEAD:${{ github.ref_name }}
