name: Cleanup verified stale branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cleanup-verified-stale-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Reverify containment and delete stale refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "_noop_check_should_not_create"
            "_should_not_create_again"
            "tmp-duckdb-repair"
          )

          existing=()
          for branch in "${branches[@]}"; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
              echo "${branch}: already absent"
              continue
            fi

            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.ahead_by')"
            if [[ "${ahead}" != "0" ]]; then
              echo "::error::Refusing cleanup: ${branch} has ${ahead} commit(s) not contained in main."
              exit 1
            fi
            existing+=("${branch}")
            echo "${branch}: verified fully contained in main"
          done

          for branch in "${existing[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "${branch}: deleted"
          done
